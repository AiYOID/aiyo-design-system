<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AiYO Design System</title>
    <meta name="description" content="The AiYO theme for HeroUI v3, AiYO page blocks and app patterns, with docs your AI agents can read." />
    <meta name="theme-color" content="#0052FF" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F172A'/%3E%3C/svg%3E" />
    <link rel="alternate" type="text/plain" href="./llms.txt" title="llms.txt" />
    <script>
      // Apply the saved theme before first paint. Same key and classes as HeroUI's useTheme.
      try {
        var saved = localStorage.getItem("heroui-theme")
        var dark = saved === "dark" || ((!saved || saved === "system") && matchMedia("(prefers-color-scheme: dark)").matches)
        var theme = dark ? "dark" : "light"
        document.documentElement.classList.add(theme)
        document.documentElement.setAttribute("data-theme", theme)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
